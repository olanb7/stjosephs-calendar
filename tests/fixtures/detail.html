<!doctype html>
<html>
  <body>
    <div id="MainContent_ctlCalendar_updCalendar">
      <div id="MainContent_ctlCalendar_pnlEventDetails" style="margin-bottom:30px;">
        <div class="EventDetail">
          <div class="EventItem EventListDetail">
            <div class="ColLabel EventTitleLbl">Event:</div>
            <div class="EventTitle ColControl">
              <span id="MainContent_ctlCalendar_repDetails_ctlEventDetail_0_lblEventName_0">Early May Bank Holidays (School Closed)</span>
            </div>

            <div class="EventTime">
              <div class="ColLabel StartsLbl">Starts:</div>
              <div class="Starts ColControl">
                <span id="MainContent_ctlCalendar_repDetails_ctlEventDetail_0_lblStartDate_0" class="StartDate">04-May-26</span>
                <span id="MainContent_ctlCalendar_repDetails_ctlEventDetail_0_lblStartTime_0">09:00</span>
              </div>

              <div class="ColLabel EndsLbl">Ends:</div>
              <div class="Ends ColControl">
                <span id="MainContent_ctlCalendar_repDetails_ctlEventDetail_0_lblEndDate_0" class="EndDate">05-May-26</span>
                <span id="MainContent_ctlCalendar_repDetails_ctlEventDetail_0_lblEndTime_0">15:00</span>
              </div>
            </div>

            <div class="ColLabel EventDescriptionLbl">About:</div>
            <div class="EventDescription ColControl">
              <span id="MainContent_ctlCalendar_repDetails_ctlEventDetail_0_lblDescription_0">School closed for the bank holiday.</span>
            </div>

            <div class="ColLabel">More Info:</div>
            <div class="EventMoreInfo ColControl">
              <span id="MainContent_ctlCalendar_repDetails_ctlEventDetail_0_lblMoreInfo_0">See the term calendar.</span>
              <a id="MainContent_ctlCalendar_repDetails_ctlEventDetail_0_lnkURL_0" href="https://www.stjosephsps.co.uk/Calendar"></a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
